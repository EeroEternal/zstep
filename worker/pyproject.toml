[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zstep-worker"
version = "0.1.0"
description = "Explicit sm_120 step GPU worker for zstep (8x NVIDIA RTX 6000D)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["zstep_worker*"]

[tool.pytest.ini_options]
pythonpath = ["."]
