[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zstep-worker"
version = "1.0.0"
description = "Explicit step GPU worker for zstep (NVIDIA SM120 & T-Head PPU-ZW810E SAIL)"
requires-python = ">=3.11"
license = { text = "MIT" }
# Keep core dependencies CPU-light so SHM layout parity, P2P topology, speculative
# verification, env config, and AST hot-path guards run in lightweight CI without CUDA.
dependencies = [
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10.0",
    "ruff==0.9.10",
]
# Reference SM120 runtime stack: `vllm/vllm-openai:v0.31.0` (`torch==2.13.0+cu130`,
# CUDA 13.0) overlaid with `./scripts/prepare_sm120_overlay.sh`
# (`worker/third_party/flashinfer_sm120_overlay_d0cbb476.tar.xz`).
gpu = [
    "torch>=2.13.0",
    "triton>=3.6.0",
    "safetensors>=0.4.5",
]

[tool.setuptools.packages.find]
include = ["zstep_worker*"]

[tool.setuptools.package-data]
"zstep_worker.kernels_sm120" = ["csrc/*.cpp", "csrc/*.cu", "csrc/*.cuh"]
"zstep_worker.kernels_sail" = ["csrc/*.cpp", "csrc/*.cu", "csrc/*.cuh"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "S110", "RUF100"]
