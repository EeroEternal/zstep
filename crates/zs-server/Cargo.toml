[package]
name = "zs-server"
description = "zstep Mode B master CLI: continuous-batching scheduler, Top-2 greedy verifier, and benchmark driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zstep"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zs-scheduler = { path = "../zs-scheduler" }
zs-kv = { path = "../zs-kv" }
zs-wire = { path = "../zs-wire" }

[lints]
workspace = true
