name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt, clippy & tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace unit & SHM protocol tests
        run: cargo test --workspace

  python:
    name: Python ruff, CPU unit tests & AST hot-path guards
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install worker package with pinned test dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e "./worker[test]"
      - name: Ruff lint
        run: .venv/bin/ruff check worker/
      - name: CPU unit tests, SHM parity & AST hot-path guards
        run: |
          .venv/bin/pytest -q \
            worker/tests/test_shm_layout_parity.py \
            worker/tests/test_p2p_probe.py \
            worker/tests/test_spec_decode.py \
            worker/tests/test_b12x_dsv41_lifecycle.py \
            worker/tests/test_coordinator_e2e.py \
            worker/tests/test_env_config.py \
            worker/tests/test_hotpath_ast_guards.py \
            worker/tests/test_sampler.py
