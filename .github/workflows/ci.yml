name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust fmt, clippy & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace unit & SHM protocol tests
        run: cargo test --workspace

  python:
    name: Python ruff & SHM wire parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint & test dependencies
        run: python -m pip install --upgrade pip ruff pytest numpy
      - name: Ruff lint
        run: ruff check worker/
      - name: Cross-language SHM layout & protocol parity
        working-directory: worker
        run: pytest -q tests/test_shm_layout_parity.py
